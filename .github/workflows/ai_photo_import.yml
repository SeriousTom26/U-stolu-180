name: U stolu - automaticky import AI fotografii

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai_photo_import.yml'
      - 'scripts/import_ai_photos.py'
      - 'scripts/ai_photo_import.tsv'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fotografie:
    runs-on: ubuntu-latest
    steps:
      - name: Stahnout repozitar
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Nainstalovat kontrolu fotografii
        run: python -m pip install 'Pillow>=10,<13'
      - name: Stahnout deset originalnich AI fotografii podle ID
        id: import
        run: python scripts/import_ai_photos.py
      - name: Nabidnout klasicky ZIP se vsemi fotografiemi
        uses: actions/upload-artifact@v4
        with:
          name: U_STOLU_FOTKY_${{ steps.import.outputs.batch_label }}
          path: ${{ steps.import.outputs.archive_name }}
          retention-days: 30
      - name: Automaticky nahrat PNG fotografie do repozitare
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/photos/
          if ! git diff --cached --quiet; then
            git commit -m 'Pridany AI fotografie ${{ steps.import.outputs.batch_label }}'
            git push
          else
            echo 'Fotografie se nezmenily.'
          fi
      - name: Automaticky aktualizovat aplikaci U stolu
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jidelnicek.yml --ref main
